name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, coverage, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify tests and 70% line coverage
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload application and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: critter-build
          path: |
            target/*.jar
            target/site/jacoco/
          if-no-files-found: error

  release:
    name: Publish release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: critter-build
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
